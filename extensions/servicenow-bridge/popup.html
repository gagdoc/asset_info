<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>ServiceNow Bridge</title>
  <style>
    body {
      width: 300px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1e293b;
      margin: 0;
    }
    .header {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .status-card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-success { background: #dcfce7; color: #15803d; }
    .badge-danger { background: #fee2e2; color: #b91c1c; }
    .btn {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
    .hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🌐 ASSET_INFO ➔ ServiceNow</span>
  </div>

  <div class="status-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span>ServiceNow 세션:</span>
      <span id="sessionStatus" class="badge badge-danger">확인 중...</span>
    </div>
    <div id="sessionDetail" style="font-size:11px; color:#64748b;">
      브라우저에 ServiceNow 탭이 열려있는지 확인 중입니다.
    </div>
  </div>

  <button id="openSnowBtn" class="btn">ServiceNow 탭 열기</button>

  <div class="hint">
    💡 Stryker ServiceNow(strykercorp.service-now.com)에 로그인된 탭이 브라우저에 하나 이상 열려 있으면 어셋인포에서 실시간 자산 자동 동기화가 활성화됩니다.
  </div>

  <script src="popup.js"></script>
</body>
</html>
